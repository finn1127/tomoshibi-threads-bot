name: 灯 自動投稿

on:
  schedule:
    - cron: "30 21 * * *"  # JST 06:30 (morning, 前日UTC)
    # 新しいアプリ・アカウントのため、様子見として一時的に朝のみに減らしている。
    # 安定して動くことを確認できたら、以下を復活させる。
    # - cron: "30 3 * * *"  # JST 12:30 (noon)
    # - cron: "0 11 * * *"  # JST 20:00 (night)
  workflow_dispatch:
    inputs:
      slot:
        description: "投稿枠 (morning / noon / night)"
        required: false
        default: "morning"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 投稿枠を決定
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "30 21 * * *") echo "slot=morning" >> "$GITHUB_OUTPUT" ;;
              "30 3 * * *") echo "slot=noon" >> "$GITHUB_OUTPUT" ;;
              "0 11 * * *") echo "slot=night" >> "$GITHUB_OUTPUT" ;;
              *) echo "slot=morning" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: 生成して投稿
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          SLOT: ${{ steps.slot.outputs.slot }}
        run: python3 scripts/generate_and_post.py
