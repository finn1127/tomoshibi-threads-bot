name: 灯 投稿（手動実行）

on:
  # GitHub Actionsのスケジュール実行は混雑時に2〜5時間遅延することが
  # 常態化していたため停止。GitHubのActionsタブから手動で
  # 「Run workflow」を実行する運用に切り替えた。
  workflow_dispatch:
    inputs:
      slot:
        description: "投稿枠 (morning / noon / night)"
        required: false
        default: "morning"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成して投稿
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          SLOT: ${{ inputs.slot }}
        run: python3 scripts/generate_and_post.py
